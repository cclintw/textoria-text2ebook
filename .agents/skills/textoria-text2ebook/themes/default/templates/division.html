{% extends "base.html" %}
{% block body %}
<main class="view layout reader-left-collapsed reader-entering">
  <aside id="readerSidebar" class="side" aria-label="章節目錄">
    <div id="readerToc"><h3>章節</h3>{{ toc_html | safe }}</div>
  </aside>
  <section id="readerSearch" class="reader-search-popover" aria-label="尋找" hidden>
    <input id="readerQuery" type="search" aria-label="在這本書中尋找" placeholder="在這本書中尋找" autocomplete="off">
    <section id="readerResults" aria-label="搜尋結果" hidden>
      <p id="readerResultCount" class="meta" role="status"></p>
      <div id="readerResultList"></div>
      <button id="readerMoreResults" type="button" hidden>顯示更多</button>
    </section>
  </section>
  <article id="readerContent" class="content reader reader-slide-ready">
    {{ paragraph_html | safe }}
    {{ chapter_nav_html | safe }}
  </article>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ site_prefix }}data/search_index.js"></script>
<script src="{{ asset_prefix }}js/reader-search.js?v=reader-search-2" data-site-root="{{ site_prefix }}" id="readerSearchScript"></script>
{% endblock %}
